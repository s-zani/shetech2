<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"> 
<title>Cosa guardo stasera</title>
<style>
:root{--bg:#0e0e11;--card:#17171c;--card2:#1e1e25;--txt:#f2f2f4;--dim:#9a9aa6;
      --acc:#ffd93d;--rt:#fa6b53;--line:#2a2a33}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;margin:0}
header{padding:32px 24px 18px;max-width:1400px;margin:0 auto}
h1{font-size:clamp(28px,4vw,44px);margin:0 0 6px;letter-spacing:-.02em}
h1 span{color:var(--acc)}
.sub{color:var(--dim);font-size:clamp(14px,1.6vw,18px)}
.controls{max-width:1400px;margin:0 auto;padding:0 24px 20px;position:sticky;top:0;background:linear-gradient(var(--bg) 84%,transparent);z-index:5}
#q{width:100%;padding:16px 20px;font-size:18px;background:var(--card);border:2px solid var(--line);border-radius:12px;color:var(--txt);outline:none}
#q:focus{border-color:var(--acc)}
#q::placeholder{color:var(--dim)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--dim);cursor:pointer;font-size:14px;white-space:nowrap;transition:.15s;font-family:inherit}
.pill:hover{color:var(--txt);border-color:#3d3d47}
.pill.on{background:var(--acc);color:#0e0e11;border-color:var(--acc);font-weight:600}
.pill.sole.on{background:#7ee787;border-color:#7ee787}
.count{color:var(--dim);font-size:14px;margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#reset{background:none;border:1px solid var(--line);color:var(--acc);padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px;max-width:1400px;margin:0 auto;padding:6px 24px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s;text-align:left;color:inherit;font:inherit}
.card:hover,.card:focus-visible{background:var(--card2);border-color:#3d3d47;transform:translateY(-2px);outline:none}
.card:focus-visible{border-color:var(--acc)}
.title{font-size:19px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.meta{color:var(--dim);font-size:14px}
.voti{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.v{font-weight:700;font-size:15px;padding:4px 10px;border-radius:7px;font-variant-numeric:tabular-nums}
.v.imdb{background:var(--acc);color:#0e0e11}
.v.rt{background:var(--rt);color:#fff}
.v.no{background:transparent;border:1px dashed var(--line);color:var(--dim);font-weight:500;font-size:13px}
.mood{display:inline-block;align-self:flex-start;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;margin-top:auto}
.riga{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.wish{background:none;border:1px solid var(--line);color:var(--dim);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1;flex:none;transition:.15s;font-family:inherit}
.wish:hover{border-color:var(--acc);color:var(--acc)}
.wish.on{background:var(--acc);border-color:var(--acc);color:#0e0e11}
.wish.large{width:auto;height:auto;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:600}
#wishbar{background:var(--card);border:1px solid var(--acc);color:var(--acc);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.empty{text-align:center;color:var(--dim);padding:60px 24px;font-size:18px;grid-column:1/-1}
/* dettaglio */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.ov[hidden]{display:none}
.dt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.dt h2{margin:0;font-size:clamp(24px,3.4vw,32px);line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.dt .meta{font-size:15px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.box .lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600}
.box p{margin:0;font-size:17px;line-height:1.55}
.box.vuoto p{color:var(--dim);font-size:15px}
.vv{display:flex;gap:14px;flex-wrap:wrap}
.vv .blocco{flex:1;min-width:130px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.vv .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.vv .n.imdb{color:var(--acc)} .vv .n.rt{color:var(--rt)}
.vv .l{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:4px}
#chiudi{align-self:flex-end;background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:10px 20px;border-radius:999px;cursor:pointer;font:inherit;font-size:15px}
#chiudi:hover{border-color:var(--acc)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
@media(max-width:640px){
 .grid{grid-template-columns:1fr;padding:6px 16px 48px}
 header{padding:20px 16px 12px}.controls{padding:0 16px 16px}
 #pg{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
 #pg::-webkit-scrollbar{display:none}
 .pill{font-size:13px;padding:8px 14px}
 .ov{padding:12px}.dt{padding:24px}
}
</style>
</head>

let fm='', fg='', soloArr=false, soloWish=false, vista=[];
let WISH = [];
try { WISH = JSON.parse(localStorage.getItem('wishlist') || '[]'); } catch(e) { WISH = []; }
const inWish = t => WISH.includes(t);
function toggleWish(t){
  WISH = inWish(t) ? WISH.filter(x=>x!==t) : [...WISH, t];
  try { localStorage.setItem('wishlist', JSON.stringify(WISH)); } catch(e) {}
  draw();
}
const el=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pills(box, arr, get, set){
  box.innerHTML='';
  arr.forEach(v=>{
    const b=document.createElement('button');
    b.className='pill'+(get()===v?' on':''); b.textContent=v;
    b.onclick=()=>{set(get()===v?'':v); draw();};
    box.appendChild(b);
  });
}
function apri(f){
  el('dt').innerHTML=`
    <h2>${esc(f.t)}</h2>
    <div class="meta">${f.a} · ${f.d?f.d+' min':'—'} · ${esc(f.g||'—')}</div>
    <div class="vv">
      <div class="blocco"><div class="n imdb">${f.i!==null?f.i.toFixed(1):'—'}</div><div class="l">IMDb</div></div>
      <div class="blocco"><div class="n rt">${f.r!==null?f.r+'%':'—'}</div><div class="l">Rotten Tomatoes</div></div>
    </div>
    <div class="mood" style="background:${COL[f.m]}22;color:${COL[f.m]}">${esc(f.m)}</div>
    ${f.p
      ? `<div class="box"><div class="lbl">Perché questo mood</div><p>${esc(f.p)}</p></div>`
      : `<div class="box vuoto"><div class="lbl">Perché questo mood</div>
         <p>Questo film non è ancora stato arricchito: nessun voto e nessuna spiegazione.
         Il mood qui è solo dedotto dal genere.</p></div>`}
    <button class="wish large${inWish(f.t)?' on':''}" id="wdet">
      ${inWish(f.t)?'★ Nella wishlist':'☆ Aggiungi alla wishlist'}</button>
    <button id="chiudi">Chiudi</button>`;
  el('ov').hidden=false; document.body.style.overflow='hidden';
  el('chiudi').onclick=chiudi;
  el('wdet').onclick=()=>{ toggleWish(f.t); apri(f); };
  el('chiudi').focus();
}
function chiudi(){ el('ov').hidden=true; document.body.style.overflow=''; }
el('ov').onclick=e=>{ if(e.target===el('ov')) chiudi(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') chiudi(); });

function draw(){
  const q=el('q').value.toLowerCase().trim();
  vista=FILM.filter(f=>
    (!q||f.t.toLowerCase().includes(q)) &&
    (!fm||f.m===fm) && (!fg||f.g.includes(fg)) && (!soloArr||f.p) && (!soloWish||inWish(f.t)));
  const attivi=q||fm||fg||soloArr||soloWish;
  el('c').innerHTML=vista.length+' film'+(attivi?' trovati':'')+
    (WISH.length?` <button id="wishbar">★ wishlist: ${WISH.length}</button>`:'')+
    (attivi?' <button id="reset">azzera filtri</button>':'');
  if(WISH.length) el('wishbar').onclick=()=>{soloWish=!soloWish;draw();};
  if(attivi) el('reset').onclick=()=>{el('q').value='';fm='';fg='';soloArr=false;soloWish=false;draw();};
  el('g').innerHTML = vista.length ? vista.map((f,idx)=>`
    <div class="card" role="button" tabindex="0" data-i="${idx}">
      <div class="title">${esc(f.t)}</div>
      <div class="meta">${f.a} · ${f.d?f.d+' min':'—'}</div>
      <div class="voti">${f.i!==null
        ? `<span class="v imdb">IMDb ${f.i.toFixed(1)}</span><span class="v rt">RT ${f.r}%</span>`
        : `<span class="v no">nessun voto</span>`}</div>
      <div class="meta">${esc(f.g||'—')}</div>
      <div class="riga">
        <span class="mood" style="background:${COL[f.m]}22;color:${COL[f.m]}">${esc(f.m)}</span>
        <button class="wish${inWish(f.t)?' on':''}" data-w="${esc(f.t)}"
                title="Aggiungi alla wishlist" aria-label="Aggiungi alla wishlist">★</button>
      </div>
    </div>`).join('') : '<div class="empty">Nessun film con questi filtri.</div>';
  el('g').querySelectorAll('.card').forEach(b=>{
    b.onclick=()=>apri(vista[+b.dataset.i]);
    b.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(vista[+b.dataset.i]); } };
  });
  el('g').querySelectorAll('.wish').forEach(w=>{
    w.onclick=e=>{ e.stopPropagation(); toggleWish(w.dataset.w); };
  });
  pills(el('pm'),MOODS,()=>fm,v=>fm=v);
  pills(el('pg'),GENERI,()=>fg,v=>fg=v);
  const s=document.createElement('button');
  s.className='pill sole'+(soloArr?' on':''); s.textContent='★ solo film lavorati';
  s.onclick=()=>{soloArr=!soloArr;draw();};
  el('pm').appendChild(s);
}
el('q').oninput=draw;
draw();
